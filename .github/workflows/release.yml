name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Sanity + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sanity gate (syntax + engine round-trip)
        run: npm run ci

      - name: Build web bundle (no game data / no Android)
        run: npm run build:engine

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Story Builder ${{ github.ref_name }}

            Passed sanity checks (syntax + in-memory engine round-trip).
            Build the Android app locally with `npm run android:apk`
            (requires Android SDK + JDK 21). See ANDROID.md.
